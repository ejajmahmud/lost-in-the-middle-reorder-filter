[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lost-in-the-middle-reorder-filter"
version = "0.1.0"
description = "Mitigates LLM attention degradation by strategically redistributing highly relevant passages to prompt boundaries (primacy and recency)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
lost-in-the-middle-reorder-filter = "lost_in_the_middle_reorder_filter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lost_in_the_middle_reorder_filter*"]
